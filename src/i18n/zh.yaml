  guide:
    lede: 一份实用的 Standard Clix 参考。先从建议范围内开始，再根据眼前的咖啡、配方和口味，每次微调一至两格。
    specLabel: 研磨器规格
    adjustment: 调节系统
    scale: 图表范围
    direction: 调节方向
    higherIsCoarser: 数字越大越粗
    factory: 出厂刻度
    chartTitle: 刻度范围图
    chartIntro: C40 标准轴的官方起始范围。这些是调试指南，并非固定配方。
    finer: 更细
    coarser: 更粗
    aeropressNote: 爱乐压的刻度取决于具体配方，因此 Comandante 没有给出单一数字范围。
    zeroTitle: 找到零点
    zeroIntro: 每个刻度都从同一个机械基准点开始计数。
    zeroSteps:
      - 清空研磨器并将它水平握住。
      - 拧紧调节盘，直到刀盘刚好能够托住手柄，不再让它自然落向六点钟方向。
      - 将第一个能托住手柄的位置视为零点，然后逆时针打开刀盘并逐格计数。
    dialNote: 从建议范围的中间开始。若咖啡淡薄、尖锐或流速过快，就调细；若苦涩、干燥或流速过慢，就调粗。最终仍以味觉为准。
    micronLabel: 单独来源的能力范围
    micronNote: Honest Coffee Guide 报告了这一总体颗粒跨度。它只作背景参考，并非逐格换算，也不属于 Comandante 官方刻度建议。
    sourcesTitle: 来源与适用范围
    sourcesIntro: 刻度范围与操作说明来自官方；微米能力范围则单独标注第三方来源。
  guides:
    1zpresso-zp6:
      lede: 一份针对 ZP6 外置调节环的实用参考；英文资料中这台研磨器以 ZP6 Special 的名称销售。先从建议范围内开始，再根据眼前的咖啡、配方和口味，每次微调一至两格。
      chartIntro: 来自 1Zpresso ZP6 Special 官方刻度建议表的起始范围，按调节环上的九个数字读取。相邻两个数字之间有 10 格，因此 4.5 表示数字 4 再加 5 格。这些是调试指南，并非固定配方。
      zeroTitle: 读懂调节环
      zeroIntro: 刻度以红点所指的位置读取，并从刀盘刚开始对摇臂产生阻力的位置计起。
      zeroSteps:
        - 清空研磨器，确保刀盘之间没有咖啡豆。
        - 逆时针转动调节环，直到感到阻力、摇臂开始带着阻力转动，该位置即为零点。
        - 顺时针旋转，读出红点指到的数字，再逐格计数得到小数部分。
      dialNote: 一格是 22 微米，十格构成一个数字，因此整数是大幅调整，单格则很细微。先从建议范围的中间开始：淡薄、尖锐或流速过快就调细，苦涩、干燥或流速过慢就调粗。最终仍以味觉为准。
      aeropressNote: 官方刻度建议表只标注虹吸／手冲与法压壶，因此 1Zpresso 没有为这台研磨器公布爱乐压的数字范围。
      micronNote: Honest Coffee Guide 报告了 ZP6 Special 的这一总体颗粒跨度。它只作背景参考，并非逐个数字的换算，也不属于 1Zpresso 官方刻度建议。
      sourcesIntro: 刻度范围与操作说明来自 1Zpresso 官方；微米能力范围则单独标注第三方来源。
    fellow-ode-brew:
      lede: 一份针对 Ode 数字刻度盘的实用参考。Ode 只为滤泡与浸泡类咖啡设计，因此这里的每个范围都属于滤泡或浸泡方式。
      chartIntro: Fellow 为 Gen 2 刀盘给出的起始范围，取自随机附带的刻度盘指南。这些是调试指南，并非固定配方。
      zeroTitle: 读懂研磨刻度盘
      zeroIntro: 刻度直接印在机身上，因此刻度是从盘面读出的，而不是从刀盘闭合的零点开始计数。
      zeroSteps:
        - 调整刻度前先空转片刻，清出残留在刀盘之间的咖啡。
        - 在电机运转时转动刻度盘：顺时针变粗，逆时针变细。
        - 将刻度盘上的标记对准印刷刻度上想要的数字。
      dialNote: 印刷数字之间还有未标注的中间格位，因此两个数字之间的位置也可以复现。先从建议范围的中间开始。若咖啡淡薄、尖锐或流速过快，就调细；若苦涩、干燥或流速过慢，就调粗。最终仍以味觉为准。
      micronNote: Honest Coffee Guide 报告了 Gen 2 刀盘的这一总体颗粒跨度。它只作背景参考，并非逐格换算，也不属于 Fellow 官方的刻度建议。
      sourcesIntro: 刻度范围与操作说明来自 Fellow 官方；微米跨度则单独标注第三方来源。
    timemore-chestnut-c5:
      lede: 一份针对 Chestnut C5 分级刻度盘的实用参考。先从建议范围内开始，再根据眼前的咖啡、配方和口味，每次微调一至两格。
      chartIntro: C5 的 48 格刻度盘上的建议起始范围。这些是调试指南，并非固定配方。
      zeroIntro: 每个刻度都从刀盘完全闭合的位置开始计数。
      zeroSteps:
        - 清空研磨器，确保刀盘之间没有咖啡豆。
        - 顺时针拧动调节盘直到无法再拧，此时刀盘完全闭合。
        - 将该闭合位置视为零点，然后逆时针旋转，随着刀盘逐渐打开变粗，逐格计数。
      sourcesIntro: 操作规格来自 Timemore 官方；刻度范围表整理自实测评测。
  sourceScopes:
    click-guidance: 官方刻度指南
    operating-guidance: 官方操作指南
    micron-capability: 第三方微米参考

